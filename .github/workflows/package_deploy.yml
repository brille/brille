name: Package and Deploy

on:
  pull_request:
  release:
    types: [created, edited, published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action == 'published' }}

defaults:
  run:
    shell: bash -l {0}

jobs:
  source:
    name: Build Source distribution
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - run: pipx run build --sdist
    - run: pipx run twine check dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/*.tar.gz

  cibuildwheel:
    name: "Build wheels for ${{ matrix.variant.platform }} on ${{ matrix.variant.os }}"
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { os: ubuntu-24.04, platform: 'manylinux' }
          - { os: ubuntu-24.04, platform: 'musllinux' }
          - { os: macos-26-intel, platform: 'macosx' }  # Intel support
          - { os: macos-26, platform: 'macosx' }  # Apple silicon support
          - { os: windows-2025, platform: "win" }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pypa/cibuildwheel@v3.4.1
        env:
          # Pull requests build one CPython per platform, 3.12; releases and
          # manual runs build every supported version.
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && format('cp312-{0}*', matrix.variant.platform) || format('*-{0}*', matrix.variant.platform) }}
          MACOSX_DEPLOYMENT_TARGET: "14"  # CIBW complains if lower

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: "cibw-wheels-${{ matrix.variant.platform }}-${{ matrix.variant.os }}"
          path: wheelhouse/*.whl

  draft:
    name: Deploy packages
    needs: [source, cibuildwheel]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    permissions:
      id-token: write
      contents: write
    environment: release

    steps:
    - uses: actions/download-artifact@v8
      id: download
      with:
        path: artifacts
    - name: Move artifacts into a single folder
      run: |
        mkdir dist
        find ${{ steps.download.outputs.download-path }} -type f -regex ".*\.\(tar\.gz\|whl\)" -exec mv {} dist/. \;
    # The release's documentation, as a snapshot of the site; the published site
    # follows main (see docs.yml). Kept out of dist/, which goes to PyPI.
    - uses: actions/checkout@v7
      with:
        path: repository
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Build the documentation archive
      working-directory: repository
      run: |
        pip install -r docs/requirements.txt
        zensical build --clean --strict
        mkdir ../docs-archive
        tar -czf "../docs-archive/brille-docs-${{ github.event.release.tag_name }}.tar.gz" -C site .
    - name: Attach artifacts to GitHub tagged draft release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        draft: ${{ github.event.action != 'published' }}
        artifacts: "dist/*.whl,dist/*.tar.gz,docs-archive/*.tar.gz"
    - name: Publish artifacts to PyPI
      if: ${{ github.event.action == 'published' }}
      uses: pypa/gh-action-pypi-publish@release/v1
